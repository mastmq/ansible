---
# Five containers standing in for VMs: three cores, two edges, and one
# standalone broker beside them. They run systemd as PID 1, so the role meets
# the same service manager it would on a real machine.
all:
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
    # The binary the harness built from ../mast, not a release: the point is
    # to test the role against the broker as it is now.
    mast_install_method: local
    mast_binary_src: "{{ playbook_dir }}/../tests/e2e/.build/mast"
    mast_version: e2e
    mast_log_format: text
  children:
    mast_core:
      hosts:
        mast-e2e-core1:
        mast-e2e-core2:
        mast-e2e-core3:
    mast_edge:
      hosts:
        mast-e2e-edge1:
        mast-e2e-edge2:
    mast_standalone:
      hosts:
        mast-e2e-solo:
          # From a release archive rather than a copied binary, so both
          # install paths are exercised.
          mast_install_method: release
          mast_release_base_url: http://mast-e2e-files:8000
