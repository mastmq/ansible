---
- name: Refuse a role mast does not have
  ansible.builtin.assert:
    that: mast_role in ['all-in-one', 'core', 'edge']
    fail_msg: "mast_role is {{ mast_role }}; it must be all-in-one, core or edge"
    quiet: true

# On a host in both tiers mast_role says which of the two processes this
# play is for, and only site.yml knows: the default says core for both.
- name: Refuse a co-located host without a tier to deploy
  ansible.builtin.assert:
    that: not (mast_colocated | bool) or mast_role in ['core', 'edge']
    fail_msg: >-
      {{ inventory_hostname }} is in both {{ mast_core_group }} and
      {{ mast_edge_group }}, so it runs a core and an edge; pass mast_role
      core or edge to the role, as site.yml does.
    quiet: true

# The core play runs first and leaves its ports behind as a fact, so the edge
# beside it can be checked against what is really bound, overrides included.
# A clash would otherwise show up as an edge that never gets healthy.
- name: Remember the ports the core on this host listens on
  ansible.builtin.set_fact:
    mast_colocated_core_ports: >-
      {{ [mast_nats_client_port, mast_nats_route_port, mast_nats_leaf_port, mast_nats_monitor_port, mast_metrics_port]
         + ([mast_admin_port] if mast_admin_enabled | bool else []) }}
  when: mast_colocated | bool and mast_role == 'core'

- name: Refuse an edge whose ports clash with the core beside it
  ansible.builtin.assert:
    that: >-
      ([mast_mqtt_port, mast_mqtt_ws_port, mast_mqtt_internal_port, mast_nats_monitor_port, mast_metrics_port]
       + ([mast_admin_port] if mast_admin_enabled | bool else []))
      | map('int') | select('gt', 0) | intersect(mast_colocated_core_ports | map('int')) | length == 0
    fail_msg: >-
      the edge on {{ inventory_hostname }} would listen on a port its core
      already holds ({{ mast_colocated_core_ports | join(', ') }}); set
      mast_colocated_edge_nats_monitor_port, mast_colocated_edge_metrics_port
      and mast_colocated_edge_admin_port to free ones.
    quiet: true
  when: mast_colocated | bool and mast_role == 'edge' and mast_colocated_core_ports is defined

- name: Check the cluster can hold its replication factor
  ansible.builtin.assert:
    that:
      - mast_core_jetstream_replicas | int >= 1
      - mast_core_jetstream_replicas | int <= groups.get(mast_core_group, []) | length
    fail_msg: >-
      mast_core_jetstream_replicas is {{ mast_core_jetstream_replicas }} but
      {{ mast_core_group }} has {{ groups.get(mast_core_group, []) | length }} hosts:
      the KV buckets cannot be created at that replication factor.
    quiet: true
  when: mast_role == 'core'

- name: Check an edge has cores to join
  ansible.builtin.assert:
    that: groups.get(mast_core_group, []) | length > 0
    fail_msg: "{{ inventory_hostname }} is an edge but {{ mast_core_group }} is empty; an edge without a core has nowhere to store anything"
    quiet: true
  when: mast_role == 'edge'

- name: Check the install source
  ansible.builtin.assert:
    that: mast_install_method == 'release' or (mast_install_method == 'local' and mast_binary_src | length > 0)
    fail_msg: "mast_install_method must be release, or local with mast_binary_src set"
    quiet: true

# health.yml waits on /readyz, which a release before v0.3.2 does not serve:
# the wait would retry a 404 for the whole health timeout and then fail with
# nothing saying why. Only a released version can be compared; a local build
# or a non-semver archive name is taken on trust.
- name: Check the release serves /readyz
  ansible.builtin.assert:
    that: mast_version is not match('^\d+\.\d+\.\d+$') or mast_version is version('0.3.2', '>=')
    fail_msg: >-
      mast_version {{ mast_version }} has no /readyz, which this collection
      waits on; it needs mast 0.3.2 or later. Use collection 0.1.2 for an
      older broker.
    quiet: true
  when: mast_install_method == 'release'

# The names and the range mast's config.Validate accepts, checked here so a
# typo fails the play before any host is touched rather than on the first
# edge's restart.
- name: Check the tracing sampler
  ansible.builtin.assert:
    that:
      - mast_tracing_sampler in ['', 'always_on', 'always_off', 'traceidratio', 'parentbased_always_on', 'parentbased_always_off', 'parentbased_traceidratio']
      - >-
        mast_tracing_sampler_arg | string | length == 0 or
        (mast_tracing_sampler_arg | string is match('^(0|1|0?\.[0-9]+|1\.0+)$'))
    fail_msg: >-
      mast_tracing_sampler must be empty or an OTEL_TRACES_SAMPLER name, and
      mast_tracing_sampler_arg empty or a ratio between 0 and 1, such as "0.01"
    quiet: true

# What mast's config.Validate and its token loader refuse at start, checked
# before any host is touched. The token is trimmed as mast trims it. The
# gather pattern is the chart's: a positive duration of at most 5s.
- name: Check the admin API settings
  ansible.builtin.assert:
    that:
      - mast_admin_token | trim | length >= 16
      - mast_admin_gather is match('^([1-9][0-9]{0,2}ms|[1-4][0-9]{3}ms|5000ms|[1-4](\.[0-9]+)?s|5(\.0+)?s|0?\.[0-9]*[1-9][0-9]*s)$')
      - mast_admin_port | int not in [mast_mqtt_port | int, mast_mqtt_ws_port | int, mast_mqtt_internal_port | int, mast_metrics_port | int, mast_nats_monitor_port | int, mast_nats_route_port | int, mast_nats_leaf_port | int, mast_nats_client_port | int]
    fail_msg: >-
      mast_admin_enabled needs mast_admin_token of at least 16 bytes (from
      ansible-vault), mast_admin_gather a positive duration of at most 5s
      such as "500ms", and mast_admin_port a port no other listener uses.
    quiet: true
  when: mast_admin_enabled | bool

# What mast's config.Validate refuses at start. A tenant id becomes a bare
# TOML key and a koanf path, so it must not hold a dot or anything to quote.
- name: Check the tenant limits
  ansible.builtin.assert:
    that:
      - mast_limits_max_connections | int >= 0
      - mast_limits_publish_rate | float >= 0
      - mast_limits_publish_burst | int >= 0
      - mast_limits_offline_queue | int >= 1
      - mast_limits_sync_interval | string is match('^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$')
      - mast_limits_sync_interval | string is not match('^(0+(\.0+)?(ns|us|ms|s|m|h))+$')
      - mast_metrics_max_tenant_labels | int >= 0
      - mast_limits_tenants is mapping
      - mast_limits_tenants.keys() | reject('match', '^[A-Za-z0-9_-]+$') | list | length == 0
      - >-
        mast_limits_tenants.values() | map('dict2items') | flatten | map(attribute='key')
        | reject('in', ['max_connections', 'publish_rate', 'publish_burst', 'offline_queue']) | list | length == 0
      - mast_limits_tenants.values() | selectattr('offline_queue', 'defined') | map(attribute='offline_queue') | map('int') | select('lt', 1) | list | length == 0
    fail_msg: >-
      mast_limits_* must not be negative, mast_limits_offline_queue must be at
      least 1, mast_limits_sync_interval a positive duration such as "2s", and
      each mast_limits_tenants entry a tenant id of letters, digits, - and _
      holding only max_connections, publish_rate, publish_burst and
      offline_queue, with offline_queue at least 1.
    quiet: true

- name: Check TLS is all or nothing
  ansible.builtin.assert:
    that: (mast_mqtt_tls_cert | length > 0) == (mast_mqtt_tls_key | length > 0)
    fail_msg: "mast_mqtt_tls_cert and mast_mqtt_tls_key must both be set, or neither"
    quiet: true

- name: Check the auth settings the broker would reject at start
  ansible.builtin.assert:
    that:
      - mast_auth_mode in ['static', 'http', 'jwt']
      - mast_auth_mode != 'http' or mast_auth_http_authn_url | length > 0
      - >-
        mast_auth_mode != 'jwt' or (
          mast_auth_jwt_algorithms | length > 0 and
          (mast_auth_jwt_hmac_secret | length > 0) != (mast_auth_jwt_public_key | length > 0))
    fail_msg: >-
      http mode needs mast_auth_http_authn_url; jwt mode needs
      mast_auth_jwt_algorithms and exactly one of mast_auth_jwt_hmac_secret
      and mast_auth_jwt_public_key.
    quiet: true
  when: mast_role != 'core'

# The config names every core by address, so a run limited to one edge still
# needs the cores' facts. Gather them from the cores themselves rather than
# asking the user to run the whole inventory.
- name: Gather facts from cores this run did not reach
  ansible.builtin.setup:
    gather_subset: [network]
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups.get(mast_core_group, []) }}"
  when:
    - mast_role != 'all-in-one'
    - (hostvars[item]['ansible_facts'] | default({}))['default_ipv4'] is not defined
  run_once: true

- name: Map the machine architecture to a release name
  ansible.builtin.set_fact:
    mast_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default('') }}"

- name: Refuse an architecture mast is not released for
  ansible.builtin.assert:
    that: mast_arch | length > 0
    fail_msg: "mast is released for amd64 and arm64; this host is {{ ansible_facts['architecture'] }}"
    quiet: true

- name: Check the service manager
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    fail_msg: "this role runs mast under systemd; {{ inventory_hostname }} uses {{ ansible_facts['service_mgr'] }}"
    quiet: true

- name: Check whether mast is already running
  ansible.builtin.systemd_service:
    name: "{{ mast_service_name }}"
  register: mast_unit
  failed_when: false

# A node that was running before this run is being restarted inside a working
# cluster, so it has to be fully healthy before the play moves on. One that
# was not is being bootstrapped, and a lone new core cannot pass the full
# health check until its peers exist.
- name: Remember whether this is a restart or a first start
  ansible.builtin.set_fact:
    mast_was_running: "{{ (mast_unit.status | default({})).ActiveState | default('') == 'active' }}"
