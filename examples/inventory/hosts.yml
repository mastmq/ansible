---
# A clustered installation: three cores holding Raft and the KV buckets, and
# as many edges as the connection count needs. Add an edge by adding a host
# here; the cores never notice.
#
# mast_private_address defaults to the address of the default route. Set it
# per host when that is not the network the nodes should talk to each other
# on: routes, leaf connections, the NATS monitor and metrics all bind there,
# and none of them authenticate.
all:
  children:
    mast_core:
      hosts:
        mast-core-1: { ansible_host: 10.0.1.11, mast_private_address: 10.0.1.11 }
        mast-core-2: { ansible_host: 10.0.1.12, mast_private_address: 10.0.1.12 }
        mast-core-3: { ansible_host: 10.0.1.13, mast_private_address: 10.0.1.13 }
    mast_edge:
      hosts:
        mast-edge-1: { ansible_host: 10.0.2.21, mast_private_address: 10.0.2.21 }
        mast-edge-2: { ansible_host: 10.0.2.22, mast_private_address: 10.0.2.22 }
    # A host here runs all-in-one: a broker of its own, with nothing to join.
    mast_standalone:
      hosts: {}
